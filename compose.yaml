# Тестовый стенд: docker compose up --build
services:
  app:
    build:
      context: .
      args:
        MODULE: app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      retries: 20

  generator:
    build:
      context: .
      args:
        MODULE: generator
    environment:
      TARGET_URL: http://app:8080
    depends_on:
      app:
        condition: service_healthy
